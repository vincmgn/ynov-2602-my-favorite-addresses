info:
  name: Add Tag to Address
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/addresses/{{addressId}}/tags"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Restaurant"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
